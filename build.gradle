buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        google()
    }
    dependencies {
    }
}

allprojects {
    apply plugin: "eclipse"

    version = '1.0'
    ext {
        appName = "SenetBoom"
        gdxVersion = '1.12.1'          // core LibGDX
        gdxTeaVMVersion = '1.0.5'      // web (TeaVM) backend — matches LibGDX 1.12.1
    }

    repositories {
        mavenCentral()
        google()
        gradlePluginPortal()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
        maven { url "https://jitpack.io" }
    }
}

// ----- DESKTOP: runs the game in a native window via LWJGL3 -------------------------------------
project(":desktop") {
    apply plugin: "java-library"

    dependencies {
        implementation project(":core")
        api "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    }
}

// ----- CORE: the shared, platform-independent game code -----------------------------------------
project(":core") {
    apply plugin: "java-library"

    dependencies {
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
    }
}

// ----- TEAVM: transpiles the game to JavaScript/HTML for itch.io (see teavm/build.gradle) --------
project(":teavm") {
    apply plugin: "java-library"

    dependencies {
        implementation project(":core")
        implementation "com.github.xpenatan.gdx-teavm:backend-teavm:$gdxTeaVMVersion"
    }
}
